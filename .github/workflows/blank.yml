# 🎤 Friday Night Funkin' - Evangelion Mod v1.0 🎤

드디어 에반게리온 프나펑 모드가 완성되었습니다! 
작곡, 일러스트, XML 작업, 컷씬 자동화 보이스, 스토리 주차(Week) 구성까지 모두 **1인 개발**로 제작한 완전판 모드입니다.

## ✨ 모드 특징 (Features)
* 🌅 **완전 한글화 및 커스텀 Week 구성** (스토리 모드 완벽 지원!)
* 🎨 **캐릭터 스프라이트 & XML 완벽 매칭** (신지, 카오루, 아스카, 레이 등장)
* 🎵 **오리지널 Inst & Voices 수록** (직접 제작한 고퀄리티 리듬 트랙)
* 🗣️ **자동화 컷씬 한국어 풀 보이스 탑재** (Edge-TTS 기반 찰떡 싱크 보이스)
* 🏹 **커스텀 화살표(Note) 디자인 적용**

## 🕹️ 실행 방법 (How to Play)
1. 다운로드한 `.zip` 파일의 압축을 풉니다.
2. 폴더 내의 엔진 실행 파일(`Funkin.exe` 또는 `PsychEngine.exe`)을 실행합니다.
3. 스토리 모드 또는 프리플레이에서 플레이를 즐겨주세요!

